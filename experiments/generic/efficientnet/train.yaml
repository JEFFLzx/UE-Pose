AUTO_RESUME: true
CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
DATA_DIR: ''
GPUS: (0,)
OUTPUT_DIR: 'new-results/soho'
LOG_DIR: 'log'
WORKERS: 4
PRINT_FREQ: 64

DATASET:
  COLOR_RGB: true
  DATASET: EventRGBAlignedDataset
  DATA_FORMAT: png
  FLIP: false
  NUM_JOINTS_HALF_BODY: 8
  PROB_HALF_BODY: -1.0
  ROOT: '../../../data/new-data/synthetic/soho'
  ROOT_ADVERSARIAL: '../../../data/new-data/synthetic/soho'
  FRAMES_DIR: 'frames'
  FRAMES_DIR_ADVERSARIAL: 'frames'
  ROT_FACTOR: 90
  SCALE_FACTOR: 0.2
  TEST_SET: test
  TRAIN_SET: train
  IMAGE_WIDTH: 800
  IMAGE_HEIGHT: 720
  SKIP_FACTOR: 2
MODEL:
  INIT_WEIGHTS: true
  NAME: pose_efficientnet_edl
  #soho NUM_JOINTS: 26 
  NUM_JOINTS: 26
  PRETRAINED: ''
  TARGET_TYPE: gaussian
  IMAGE_SIZE:
  - 512
  - 512
  HEATMAP_SIZE:
  - 128
  - 128
  SIGMA: 2
  EXTRA:
    PRETRAINED_LAYERS:
    - '*'
    FINAL_CONV_KERNEL: 1
LOSS:
  USE_TARGET_WEIGHT: true
TRAIN:
  BATCH_SIZE_PER_GPU: 20
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 30
  OPTIMIZER: adam
  LR: 0.001
  LR_FACTOR: 0.1
  LR_STEP:
  - 5
  - 20
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false
TEST:
  BATCH_SIZE_PER_GPU: 32
  MODEL_FILE: 'new-results/soho/EventRGBAlignedDataset/pose_efficientnet_edl/train/checkpoint.pth'
  FLIP_TEST: false
  POST_PROCESS: true
  SHIFT_HEATMAP: true
DEBUG:
  DEBUG: true
  SAVE_BATCH_IMAGES_GT: true
  SAVE_BATCH_IMAGES_PRED: true
  SAVE_HEATMAPS_GT: true
  SAVE_HEATMAPS_PRED: true
